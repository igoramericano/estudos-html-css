<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Site Simples</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            gap: 10px;
        }

        .div-cabecalho {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .div-area-conteudo {
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        .div-caixa-texto {
            background-color: white;
            padding: 40px;
        }

        .div-rodape {
            background-color: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="div-cabecalho">
        <div>Meu Site</div>
    </div>

    <div class="div-area-conteudo">
        <div class="div-caixa-texto">
            <div>
                <div>Texto simples centralizado na tela.</div>
            </div>
        </div>
    </div>

    <div class="div-rodape">
        <div>Mensagem do rodapé</div>
    </div>

</body>
</html>
