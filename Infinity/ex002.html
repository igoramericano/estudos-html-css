    <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prova CSS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .meu-formulario {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      padding: 30px;
      width: 100%;
      box-sizing: border-box;
    }

    @media (min-width: 480px) {
      .meu-formulario {
        width: 350px;
      }
    }

    .input-group {
      position: relative;
      margin-bottom: 20px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 12px 12px 40px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }

    .usuario::before {
      content: "👤";
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
    }

    .senha::before {
      content: "🔑";
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
    }

    .botoes {
      display: flex;
      gap: 10px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      color: white;
    }

    .btn-enviar { background-color: #007bff; }
    .btn-limpar { background-color: #6c757d; }

    button::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background-color: rgba(255, 255, 255, 0.5);
      transform: scaleX(0);
      transition: transform 0.2s ease;
    }

    button:hover::after {
      transform: scaleX(1);
    }
  </style>
</head>
<body>

  <form class="meu-formulario">
    <div class="input-group usuario">
      <input type="text" placeholder="Nome de Usuário" required>
    </div>
    
    <div class="input-group senha">
      <input type="password" placeholder="Senha" required>
    </div>

    <div class="botoes">
      <button type="submit" class="btn-enviar">Enviar</button>
      <button type="reset" class="btn-limpar">Limpar</button>
    </div>
  </form>
</body>
</html>
</form>
</body>
</html>
