<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iFrame</title>
    <style>
        /* iframe padrão 300x150px */
         iframe {
            width: 500px;
            height: 500px;
            border: 1px solid black;
        }
        
    </style>
</head>
<body>
    <h1>iFrame</h1>
    <h2>Vamos aprender exemplos de iframe</h2>
    <p>Acessando o site do <iframe src="https://www.cursoemvideo.com">CursoEmVideo</iframe> para aprender a programar</p>
    <p>O meu portifólio <iframe src="https://igoramericano.github.io/portifolio">projeto</iframe> também é muito legal</p>
</body>
</html>
